<!DOCTYPE html>
<html>
<head>
<title>Select Chapter</title>
</head>

<body>

<h1>Select Chapter</h1>

<button onclick="selectChapter('1')">Chapter 1</button>
<button onclick="selectChapter('2')">Chapter 2</button>
<button onclick="selectChapter('3')">Chapter 3</button>

<script>
function selectChapter(chapter) {
  window.location.href = "quizlist.html?chapter=" + chapter;
}
</script>

</body>
</html>
