<!DOCTYPE html>
<html>
<head>
<title>BrainPad</title>

<style>
    body{
        margin:0;
        font-family: 'Segoe UI', Arial, sans-serif;
        background:white;
    }

    /* Full Page Container */
    .container{
        background:#dbeafe; /* Soft Blue */
        width:100%;
        height:100vh;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        text-align:center;
    }

    h1{
        font-size:48px;
        color:#1e3a8a;
        margin:0;
        font-weight:700;
    }

    p{
        font-size:20px;
        color:#1e40af;
        margin-top:10px;
        margin-bottom:30px;
    }

    button{
        padding:12px 28px;
        font-size:18px;
        border:none;
        border-radius:8px;
        background:#1e40af;
        color:white;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#1e3a8a;
    }
</style>

</head>
<body>

<div class="container">
    <h1>BrainPad</h1>
    <p>Choose Your Class</p>

    <button onclick="startQuiz()">Start</button>
</div>

<script>
function startQuiz(){
    window.location.href = "class.html";
}
</script>

</body>
</html>
