<!DOCTYPE html>
<html>
<head>
<title>BrainPad</title>
<style>

body{
font-family: Arial;
text-align:center;
background: linear-gradient(135deg,#667eea,#764ba2);
color:white;
padding-top:100px;
}

h1{
font-size:50px;
}

button{
padding:15px 30px;
margin:10px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
}

</style>
</head>

<body>

<h1>BrainPad</h1>

<p>Select Your Class</p>

<button onclick="selectClass('9')">Class 9</button>
<button onclick="selectClass('10')">Class 10</button>
<button onclick="selectClass('11')">Class 11</button>
<button onclick="selectClass('12')">Class 12</button>
 <script>
function selectClass(classNumber) {
  window.location.href = "subjects.html?class=" + classNumber;
}
</script>
</body>
</html>
