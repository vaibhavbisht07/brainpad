<!DOCTYPE html>
<html>
<head>
<title>BrainPad</title>

<style>

body{
margin:0;
font-family:'Segoe UI', Arial, sans-serif;
background:white;
}

/* Full screen container */
.container{
background:#dbeafe;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

/* BrainPad title */
h1{
font-size:72px;
color:#1e40af;
margin:0;
}

/* Tagline */
.tagline{
font-size:18px;
color:#1e3a8a;
margin-top:10px;
margin-bottom:25px;
}

/* Choose class text */
p{
font-size:22px;
color:black;
margin-bottom:25px;
}

/* Button */
button{
padding:14px 32px;
font-size:18px;
border:none;
border-radius:8px;
background:#1e40af;
color:white;
cursor:pointer;
}

button:hover{
background:#1e3a8a;
}

</style>

</head>

<body>

<div class="container">

<h1>BrainPad</h1>

<div class="tagline">
We have many quizzes here. Test Yourself 😉
</div>


<button onclick="startQuiz()">Choose Your Class</button>

</div>

<script>

function startQuiz(){
window.location.href="class.html";
}

</script>

</body>
</html>
