<!DOCTYPE html>
<html>
<head>
<title>Select Class</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#fff9cc;
}

.container{
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

h1{
font-size:40px;
margin-bottom:40px;
color:#333;
}

.button-row{
display:flex;
gap:20px;
}

button{
padding:16px 36px;
font-size:18px;
border:none;
border-radius:10px;
background:#ffd84d;
color:#333;
cursor:pointer;
font-weight:600;
}

button:hover{
background:#ffcc00;
}

</style>
</head>

<body>

<div class="container">

<h1>Select Class</h1>

<div class="button-row">
<button onclick="go('9')">Class 9</button>
<button onclick="go('10')">Class 10</button>
<button onclick="go('11')">Class 11</button>
<button onclick="go('12')">Class 12</button>
</div>

</div>

<script>
function go(c){
window.location.href="subjects.html?class="+c;
}
</script>

</body>
</html>
