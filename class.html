<!DOCTYPE html>
<html>
<head>
<title>Select Class</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
}

/* Full page container */
.container{
width:100%;
height:100vh;
background:#e6b800;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

/* Title */
h1{
font-size:40px;
margin-bottom:40px;
color:#333;
}

/* Buttons */
button{
padding:15px 35px;
font-size:18px;
margin:10px;
border:none;
border-radius:8px;
background:#ffe680;
color:#333;
cursor:pointer;
font-weight:600;
}

/* Hover */
button:hover{
background:#ffd633;
}

</style>
</head>

<body>

<div class="container">

<h1>Select Class</h1>

<button onclick="go('9')">Class 9</button>
<button onclick="go('10')">Class 10</button>
<button onclick="go('11')">Class 11</button>
<button onclick="go('12')">Class 12</button>

</div>

<script>
function go(c){
window.location.href="subjects.html?class="+c;
}
</script>

</body>
</html>
