<!DOCTYPE html>
<html>
<head>
<title>BrainPad Quiz</title>

<style>

body{
margin:0;
font-family:Arial;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#1e63d6,#4fb2ff);
}

.container{
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 12px 30px rgba(0,0,0,0.2);
text-align:center;
width:450px;
}

h1{
margin-bottom:10px;
}

#timer{
color:red;
font-weight:bold;
margin-bottom:15px;
}

#question{
font-size:22px;
margin-bottom:20px;
}

.option{
display:block;
width:100%;
padding:12px;
margin:8px 0;
font-size:16px;
border:none;
border-radius:8px;
background:#1e63d6;
color:white;
cursor:pointer;
transition:0.3s;
}

.option:hover{
background:#0f4bb3;
transform:scale(1.03);
}

#nextBtn{
margin-top:15px;
padding:10px 20px;
border:none;
border-radius:6px;
background:#333;
color:white;
cursor:pointer;
}

.progressBar{
width:100%;
background:#ddd;
height:10px;
border-radius:5px;
margin:15px 0;
}

.progress{
height:10px;
width:0%;
background:#1e63d6;
border-radius:5px;
}

#result{
font-size:28px;
margin-top:20px;
}
.option.selected{background:#00b894;}
</style>
</head>

<body>

<div class="container">

<h1>🧠 BrainPad Quiz</h1>

<div id="timer">Time Left: 5:00</div>

<div id="qNumber"></div>

<div class="progressBar">
<div class="progress" id="progress"></div>
</div>

<div id="question"></div>

<button class="option" onclick="selectAnswer(0)" id="opt0"></button>
<button class="option" onclick="selectAnswer(1)" id="opt1"></button>
<button class="option" onclick="selectAnswer(2)" id="opt2"></button>

<button id="nextBtn" onclick="nextQuestion()">Next</button>

<div id="result"></div>

</div>

<script>

let questions=[
{q:"how old is minhoi = ?",o:["6","8","10"],a:1},
{q:"10 - 4 = ?",o:["6","5","7"],a:0},
{q:"6 × 2 = ?",o:["12","10","14"],a:0},
{q:"9 + 1 = ?",o:["11","10","12"],a:1},
{q:"15 - 5 = ?",o:["8","9","10"],a:2},
{q:"3 × 4 = ?",o:["7","12","10"],a:1},
{q:"20 ÷ 4 = ?",o:["6","5","4"],a:1},
{q:"7 + 6 = ?",o:["13","12","11"],a:0},
{q:"8 × 2 = ?",o:["14","16","18"],a:1},
{q:"18 ÷ 3 = ?",o:["6","5","7"],a:0}
];

let current=0;
let score=0;
let selected=-1;

function loadQuestion(){

document.getElementById("qNumber").innerHTML="Question "+(current+1)+" / 10";

document.getElementById("question").innerHTML=questions[current].q;

document.getElementById("opt0").innerHTML=questions[current].o[0];
document.getElementById("opt1").innerHTML=questions[current].o[1];
document.getElementById("opt2").innerHTML=questions[current].o[2];

document.getElementById("progress").style.width=((current)/10*100)+"%";

selected=-1;

}

function selectAnswer(i){

selected=i;

let options=document.getElementsByClassName("option");

for(let j=0;j<options.length;j++){
options[j].classList.remove("selected");
}

options[i].classList.add("selected");

}

function nextQuestion(){

if(selected==-1){
alert("Please select an option");
return;
}

if(selected==questions[current].a){
score++;
}

current++;

if(current<questions.length){
loadQuestion();
}
else{
showResult();
}

}

function showResult(){

document.querySelector(".container").innerHTML=

"<h1>🎉 Quiz Finished</h1>"+
"<div id='result'>Your Score: "+score+" / 10</div>"+
"<br><button onclick='location.href=\"quizlist.html\"'>Next Quiz</button>";

}

loadQuestion();

let time=300;

let timer=setInterval(function(){

let minutes=Math.floor(time/60);
let seconds=time%60;

if(seconds<10) seconds="0"+seconds;

document.getElementById("timer").innerHTML="Time Left: "+minutes+":"+seconds;

time--;

if(time<0){
clearInterval(timer);
showResult();
}

},1000);

</script>

</body>
</html>
