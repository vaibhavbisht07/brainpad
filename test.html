<!DOCTYPE html>
<html>
<head>
<title>BrainPad Math Quiz</title>

<style>

body{
font-family: Arial, sans-serif;
background:#f4f6fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

#container{
text-align:center;
}

h1{
margin-bottom:20px;
font-size:36px;
}

#quizBox{
background:white;
padding:35px;
width:420px;
border-radius:12px;
box-shadow:0 6px 20px rgba(0,0,0,0.15);
}

#timer{
font-size:18px;
color:#d63031;
margin-bottom:10px;
font-weight:bold;
}

#qNumber{
font-size:16px;
margin-bottom:15px;
color:#555;
}

#question{
font-size:22px;
margin-bottom:20px;
font-weight:bold;
}

.option{
display:block;
background:#f1f2f6;
margin:10px 0;
padding:12px;
border-radius:8px;
font-size:18px;
cursor:pointer;
text-align:left;
}

.option input{
margin-right:10px;
}

.option:hover{
background:#dfe6e9;
}

button{
margin-top:20px;
padding:10px 25px;
font-size:16px;
border:none;
background:#0984e3;
color:white;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#0766b3;
}

#progressBar{
width:100%;
height:15px;
background:#ddd;
border-radius:10px;
margin-top:20px;
}

#progress{
height:15px;
width:0%;
background:#00b894;
border-radius:10px;
}

#result{
font-size:40px;
font-weight:bold;
margin-top:30px;
}

</style>
</head>

<body>

<div id="container">

<h1>BrainPad Math Quiz</h1>

<div id="quizBox">

<div id="timer">Time Left: 5:00</div>

<div id="qNumber"></div>

<div id="question"></div>

<label class="option">
<input type="radio" name="answer" value="0">
<span id="opt0"></span>
</label>

<label class="option">
<input type="radio" name="answer" value="1">
<span id="opt1"></span>
</label>

<label class="option">
<input type="radio" name="answer" value="2">
<span id="opt2"></span>
</label>

<button onclick="nextQuestion()">Next</button>

<div id="progressBar">
<div id="progress"></div>
</div>

<div id="result"></div>

</div>
</div>

<script>

let questions=[
{q:"5 + 3 = ?",o:["6","8","10"],a:1},
{q:"10 - 4 = ?",o:["6","5","7"],a:0},
{q:"6 × 2 = ?",o:["12","10","14"],a:0},
{q:"9 + 1 = ?",o:["11","10","12"],a:1},
{q:"15 - 5 = ?",o:["8","9","10"],a:2},
{q:"3 × 4 = ?",o:["7","12","10"],a:1},
{q:"20 ÷ 4 = ?",o:["6","5","4"],a:1},
{q:"7 + 6 = ?",o:["13","12","11"],a:0},
{q:"8 × 2 = ?",o:["14","16","18"],a:1},
{q:"18 ÷ 3 = ?",o:["6","5","7"],a:0}
];

let current=0;
let score=0;

function loadQuestion(){

let q=questions[current];

document.getElementById("qNumber").innerHTML="Question "+(current+1)+" / 10";

document.getElementById("question").innerHTML=q.q;

document.getElementById("opt0").innerHTML=q.o[0];
document.getElementById("opt1").innerHTML=q.o[1];
document.getElementById("opt2").innerHTML=q.o[2];

let radios=document.getElementsByName("answer");
for(let r of radios) r.checked=false;

document.getElementById("progress").style.width=((current)/10*100)+"%";

}

function nextQuestion(){

let radios=document.getElementsByName("answer");
let selected=-1;

for(let r of radios){
if(r.checked) selected=r.value;
}

if(selected==-1){
alert("Please select an option");
return;
}

if(selected==questions[current].a) score++;

current++;

if(current<questions.length){
loadQuestion();
}else{
showResult();
}

}

function showResult(){

document.getElementById("quizBox").innerHTML=
"<div id='result'>Your Score: "+score+" / 10</div><br><button onclick='location.reload()'>Next Quiz</button>";

}

loadQuestion();

let time=300;

let timer=setInterval(function(){

let minutes=Math.floor(time/60);
let seconds=time%60;

if(seconds<10) seconds="0"+seconds;

document.getElementById("timer").innerHTML="Time Left: "+minutes+":"+seconds;

time--;

if(time<0){
clearInterval(timer);
showResult();
}

},1000);

</script>

</body>
</html>
